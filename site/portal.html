    background-size:contain;background-repeat:no-repeat;background-position:center}

  .app{display:flex;min-height:100vh}

  /* sidebar */
  .side{width:236px;flex:0 0 236px;border-right:1px solid var(--line-soft);position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;padding:22px 0}
  .side .brand{display:flex;align-items:center;gap:11px;padding:0 22px 22px;border-bottom:1px solid var(--line-soft)}
  .side .brand .logo-mark{width:42px;height:21px}
  .side .brand b{font-size:16px;font-weight:700;letter-spacing:-.02em}
  .side nav{padding:14px 0;flex:1;overflow-y:auto}
  .side .item{display:flex;align-items:center;gap:10px;padding:11px 22px;font-size:12px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;color:var(--grey);cursor:pointer;border-left:3px solid transparent;transition:.14s}
  .side .item:hover{color:var(--white)}
  .side .item.on{color:var(--white);border-left-color:var(--white)}
  .side .item .num{font-size:10px;color:var(--grey)}
  .side .item.on .num{color:var(--white)}
  .side .item .beta{font-size:8px;border:1px solid var(--line);padding:1px 4px;letter-spacing:.1em;color:var(--grey);margin-left:auto}
  .side .user{display:flex;align-items:center;gap:10px;padding:16px 22px 0;border-top:1px solid var(--line-soft);margin-top:8px}
  .side .user .av{width:30px;height:30px;border:1px solid var(--line);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .side .user .who{font-size:11px;line-height:1.4}.side .user .who b{font-weight:700}.side .user .who span{color:var(--grey);display:block}

  /* main */
  .main{flex:1;min-width:0}
  .top{display:flex;align-items:center;gap:18px;padding:18px 34px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);z-index:20}
  .top .hello{font-size:13px;font-weight:700;letter-spacing:-.01em}.top .hello span{color:var(--grey);font-weight:400}
  .top .search{flex:1;max-width:440px;margin-left:10px}
  .top .search input{width:100%;background:transparent;border:1px solid var(--line-soft);color:var(--white);font-family:inherit;
    font-size:12px;padding:10px 14px;outline:none}
  .top .search input:focus{border-color:var(--violet)}
  .top .search input::placeholder{color:var(--grey)}
  .top .meta{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
  .top .bell{border:1px solid rgba(255,45,85,.5);color:var(--red);padding:5px 9px}

  .view{padding:30px 34px 60px;animation:fade .25s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .phead{margin-bottom:26px}
  .phead h1{font-size:clamp(30px,4.4vw,52px);font-weight:700;letter-spacing:-.04em;line-height:.95}
  .phead h1 .br{color:var(--violet)}
  .phead p{margin-top:10px;font-size:13px;color:var(--grey2);max-width:64ch;line-height:1.5}

  .shead{display:flex;align-items:baseline;gap:14px;padding-bottom:14px;margin:34px 0 18px;border-bottom:2px solid var(--white)}
  .shead .sn{font-size:13px;font-weight:700;color:var(--violet)}
  .shead .st{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .shead .ex{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}

  /* metric cells */
  .cells{display:grid;border-top:1px solid var(--line);border-left:1px solid var(--line-soft)}
  .cells.c4{grid-template-columns:repeat(4,1fr)}.cells.c3{grid-template-columns:repeat(3,1fr)}.cells.c2{grid-template-columns:repeat(2,1fr)}
  .cell{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:20px 18px}
  .cell .v{font-size:clamp(24px,3.2vw,38px);font-weight:700;letter-spacing:-.03em;line-height:1}
  .cell .k{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin-top:10px}
  .cell .d{font-size:11px;color:var(--grey2);margin-top:6px}
  .cell .d.up{color:var(--green)}.cell .d.up::before{content:"\2191 "}
  .cell .d.dn{color:var(--red)}.cell .d.dn::before{content:"\2193 "}

  .cols{display:grid;gap:14px}
  .cols.t2{grid-template-columns:1fr 1fr}.cols.t3{grid-template-columns:1fr 1fr 1fr}.cols.s{grid-template-columns:1.6fr 1fr}
  .panel{border:1px solid var(--line-soft);padding:20px}
  .panel .pt{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grey);margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .panel .pt .r{margin-left:auto;color:var(--grey2)}
  .panel .pt .r.ai{color:var(--violet)}
  .big{font-size:clamp(22px,3vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.05}

  .lst .r{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft);align-items:baseline}
  .lst .r:last-child{border-bottom:none}
  .lst .r .t{font-size:10px;font-weight:700;color:var(--violet);flex:0 0 50px;letter-spacing:.05em}
  .lst .r .c{flex:1}.lst .r .c b{font-weight:700;font-size:14px}.lst .r .c span{display:block;font-size:12px;color:var(--grey);margin-top:3px}
  .lst .r .tag{margin-left:auto}
  .lst .r .dot{margin-top:5px}

  .tag{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:3px 7px;white-space:nowrap;color:var(--grey2)}
  .tag.ok{color:var(--green);border-color:rgba(43,255,102,.5)}
  .tag.warn{color:var(--amber);border-color:rgba(255,224,0,.5)}
  .tag.risk{color:var(--red);border-color:rgba(255,45,85,.55)}
  .tag.info{color:var(--cyan);border-color:rgba(46,107,255,.5)}
  .tag.ai{color:var(--violet);border-color:rgba(176,38,255,.55)}

  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .dot.g{background:var(--green);box-shadow:0 0 10px rgba(43,255,102,.55)}.dot.a{background:var(--amber);box-shadow:0 0 10px rgba(255,224,0,.5)}.dot.r{background:var(--red);box-shadow:0 0 10px rgba(255,45,85,.55)}.dot.v{background:var(--violet);box-shadow:0 0 10px rgba(176,38,255,.55)}.dot.c{background:var(--cyan);box-shadow:0 0 11px rgba(46,107,255,.7)}

  /* table */
  .tbl{width:100%;border-collapse:collapse;border-top:1px solid var(--line)}
  .tbl th{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);text-align:left;padding:12px 12px;border-bottom:1px solid var(--line)}
  .tbl td{padding:16px 12px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:top}
  .tbl .nm{font-weight:700;font-size:14px}.tbl .sub{font-size:11px;color:var(--grey);margin-top:3px}
  .pbar{height:4px;background:rgba(255,255,255,.14);width:84px;margin-top:5px}.pbar i{display:block;height:100%;background:#fff}
  .pbar i.g{background:var(--green)}.pbar i.a{background:var(--amber)}.pbar i.r{background:var(--red)}.pbar i.c{background:var(--cyan)}
  .pos{color:var(--green)}.neg{color:var(--red)}

  /* phase timeline */
  .phases{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line-soft)}
  .phase{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:16px 14px}
  .phase .n{font-size:11px;font-weight:700;color:var(--violet)}
  .phase .nm{font-size:14px;font-weight:700;margin:8px 0 3px;letter-spacing:-.01em}
  .phase .c{font-size:11px;color:var(--grey)}
  .phase .q{font-size:22px;font-weight:700;margin-top:12px;letter-spacing:-.02em}

  /* filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
  .pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);padding:8px 13px;cursor:pointer;transition:.14s}
  .pill:hover{border-color:var(--white)}.pill.on{background:var(--violet);color:#0a0414;border-color:var(--violet)}

  /* charts */
  .barc .row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .barc .row:last-child{border-bottom:none}
  .barc .bl{font-size:13px;font-weight:700;flex:0 0 120px}
  .barc .bt{flex:1;height:9px;background:rgba(255,255,255,.10)}
  .barc .bt i{display:block;height:100%}
  .barc .bv{font-size:15px;font-weight:700;flex:0 0 48px;text-align:right;letter-spacing:-.02em}
  .stack{display:flex;height:64px;border:1px solid var(--line-soft);overflow:hidden}
  .seg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;overflow:hidden;transition:filter .15s;text-align:center;padding:0 4px}
  .seg:hover{filter:brightness(1.13)}
  .seg .lab{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .seg .cnt{font-size:20px;font-style:normal;letter-spacing:-.02em;line-height:1;margin-top:4px}
  .legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
  .legend .lg{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--grey2)}

function donut(pct,color){const r=54,c=2*Math.PI*r,off=(c*(1-pct/100)).toFixed(1);

    <text x="66" y="68" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="32" font-weight="700">${pct}%</text></svg>`;}
// horizontal bar chart
function barChart(rows){return `<div class="barc">`+rows.map(r=>`<div class="row"><span class="bl">${r[0]}</span><div class="bt"><i style="width:${r[1]}%;background:${r[2]}"></i></div><span class="bv">${r[1]}%</span></div>`).join('')+`</div>`;}
// sparkline
function spark(pts,color){const w=320,h=64,max=Math.max(...pts),min=Math.min(...pts);
  const X=i=>(i/(pts.length-1)*w).toFixed(1),Y=v=>(h-((v-min)/(max-min||1))*(h-8)-4).toFixed(1);
  const d=pts.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="${color}" stroke-width="2.5" points="${d}"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1])}" r="4" fill="${color}"/></svg>`;}

const nav=document.getElementById('nav'), view=document.getElementById('view');
let active='home';
nav.innerHTML=TABS.map(t=>`<div class="item ${t.id===active?'on':''}" data-id="${t.id}"><span class="num">${t.n}</span>${t.label}${t.beta?'<span class="beta">BETA</span>':''}</div>`).join('');
function go(id){active=id;
  nav.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',e.dataset.id===id));
  view.innerHTML=TABS.find(t=>t.id===id).render();
  window.scrollTo({top:0,behavior:'smooth'});
}
nav.querySelectorAll('.item').forEach(e=>e.addEventListener('click',()=>go(e.dataset.id)));
view.addEventListener('click',e=>{const p=e.target.closest('.pill');if(p){p.parentElement.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));p.classList.add('on');}});
(function(){var v=TABS.some(function(t){return t.id===location.hash.replace('#','')});go(v?location.hash.replace('#',''):'home');})();

(function(){
  var hr=new Date().getHours();
  var greet=hr<12?'Good morning':(hr<18?'Good afternoon':'Good evening');
  var hello=document.querySelector('.hello');
  function setGreeting(name){ if(hello) hello.innerHTML=greet+', <span>'+(name||'')+'</span>'; }
  var dLong=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  var intro=document.getElementById('intro'),s1=document.getElementById('ist1'),s2=document.getElementById('ist2');
  var btn=document.getElementById('i-continue'); btn.style.display='none';

  function updTop(loc,temp){var el=document.getElementById('topctx');if(!el)return;
    var s=new Date().toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});
    if(loc&&loc.city) s=loc.city+(temp!=null?' · '+temp+'°C':'')+' · '+s; el.textContent=s;}
  function getLoc(){return new Promise(function(res){
    function ip(){fetch('https://ipwho.is/').then(function(r){return r.json();}).then(function(j){
      if(j&&j.success!==false)res({lat:j.latitude,lon:j.longitude,city:j.city,region:j.region});else res(null);}).catch(function(){res(null);});}
    if(!navigator.geolocation)return ip();
    navigator.geolocation.getCurrentPosition(function(pp){var o={lat:pp.coords.latitude,lon:pp.coords.longitude};
      fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+o.lat+'&longitude='+o.lon+'&localityLanguage=en')
        .then(function(r){return r.json();}).then(function(j){o.city=j.city||j.locality;o.region=j.principalSubdivision;res(o);}).catch(function(){res(o);});
    },function(){ip();},{timeout:6000,maximumAge:600000});});}
  var weatherP=new Promise(function(resolve){
    getLoc().then(function(loc){
      if(!loc){updTop(null);return resolve('Operating from Brazil.');}
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lon+'&current=temperature_2m,relative_humidity_2m')
        .then(function(r){return r.json();}).then(function(wj){
          var temp=Math.round(wj.current.temperature_2m),hum=wj.current.relative_humidity_2m;
          var place=[loc.city,loc.region].filter(Boolean).join(', ')||'your location';
          updTop(loc,temp); resolve('Weather in '+place+': '+temp+'°C, humidity '+hum+'%.');
        }).catch(function(){var place=[loc.city,loc.region].filter(Boolean).join(', ')||'your location';updTop(loc,null);resolve('Your operation: '+place+'.');});
    }).catch(function(){resolve('Operating from Brazil.');});});
  function settle(pr,ms){return Promise.race([pr,new Promise(function(r){setTimeout(function(){r('Operating from Brazil.');},ms);})]);}

  function type(el,text,speed){return new Promise(function(done){
    el.innerHTML=''; var cur=document.createElement('span'); cur.className='cur'; cur.textContent='_'; el.appendChild(cur); var i=0;
    (function step(){ if(i<text.length){ cur.insertAdjacentText('beforebegin',text[i]); i++; setTimeout(step,speed); } else done(); })();
  });}

  function runIntro(){
    var seq=[
      function(){return type(document.getElementById('l1'),'Preparing your operational context…',28);},
      function(){return type(document.getElementById('l2'),'Today is '+dLong+'.',22);},
      function(){return settle(weatherP,5000).then(function(t){return type(document.getElementById('l3'),t,16);});},
      function(){return type(document.getElementById('l4'),'Brazil market: Ibovespa under watch, BRL monitored and Selic stable.',14);},
      function(){return type(document.getElementById('l5'),'Syncing priorities across Workspace, Projects and Vault.',14);}
    ];
    (function next(k){ if(k>=seq.length){ btn.style.display='inline-block'; btn.style.animation='lineIn .5s ease forwards'; return; }
      seq[k]().then(function(){ setTimeout(function(){next(k+1);},260); }); })(0);
  }

  function startIntro(){
    intro.style.display=''; intro.classList.remove('gone');
    s1.removeAttribute('hidden'); s2.setAttribute('hidden','');
    ['l1','l2','l3','l4','l5'].forEach(function(id){var el=document.getElementById(id); if(el) el.innerHTML='';});
    btn.style.display='none';
    setTimeout(function(){ s1.setAttribute('hidden',''); s2.removeAttribute('hidden'); runIntro(); },1900);
  }
  function applyClientData(){
    var nameEl=document.querySelector('.i-nm'); if(nameEl) nameEl.textContent=(PROFILE.contact_name||'')+'.';
    setGreeting(PROFILE.contact_name);
    var who=document.querySelector('.user .who');
    if(who){ var b=who.querySelector('b'),sp=who.querySelector('span');
      if(b) b.textContent=PROFILE.contact_name||'';
      if(sp) sp.textContent=[PROFILE.company_name,PROFILE.role_label].filter(Boolean).join(' · ');
    }
    var av=document.querySelector('.user .av'); if(av) av.textContent=PROFILE.avatar_initials||'';
    go(active);
  }

  function loadClientData(uid){
    Promise.all([
      supabaseClient.from('client_profiles').select('*').eq('user_id',uid).maybeSingle(),
      supabaseClient.from('client_projects').select('*').eq('user_id',uid),
      supabaseClient.from('client_proposals').select('*').eq('user_id',uid)
    ]).then(function(res){
      if(res[0].data) PROFILE=res[0].data;
      if(res[1].data) PROJECTS=res[1].data;
      if(res[2].data) PROPOSALS=res[2].data;
      applyClientData();
    });
  }

  btn.addEventListener('click',function(){intro.classList.add('gone');setTimeout(function(){intro.style.display='none';},650);});
  supabaseClient.auth.getSession().then(function(res){
    var session=res.data && res.data.session;
    if(!session){ location.href='acesso.html'; return; }
    startIntro();
    loadClientData(session.user.id);
    window.addEventListener('pageshow',function(e){ if(e.persisted) startIntro(); });
  });
})();
</script>
